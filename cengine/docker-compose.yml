# Full-stack deployment: the C brain engine + two example embodiments.
#
# The browser examples (examples/drone-web, examples/rover-web) talk to the
# brain ONLY through the API exposed here: WS :8787/stream (RGB frames in,
# action frames out) + REST :8788 (telemetry / actions / memory / health).
#
#   docker compose -f cengine/docker-compose.yml up --build
#   -> open http://localhost:5199 (drone) or http://localhost:5200 (rover)
#
services:
  brain:
    build:
      context: ..
      dockerfile: cengine/Dockerfile
    container_name: flybrain-c
    # NOTE: the image CMD pins the drone profile. Driving examples/rover-web?
    # Override the command: command: ["./flybrain-server", "--config",
    #   "/app/config/flybrain.json", "--profile", "/app/config/profiles/rover.json"]
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      # connectome binary + config (read-only), mirroring the repo layout
      - ../data:/app/data:ro
      - ../config:/app/config:ro
      # learned weights persist here between runs
      - ../state:/app/state
    restart: unless-stopped

  web:
    image: node:22-alpine
    container_name: flybrain-web
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5199"
    ports:
      - "5199:5199"
    volumes:
      - ../examples/drone-web:/app
    depends_on:
      - brain
    restart: unless-stopped

  rover-web:
    image: node:22-alpine
    container_name: flybrain-rover-web
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5200"
    ports:
      - "5200:5200"
    volumes:
      - ../examples/rover-web:/app
    depends_on:
      - brain
    restart: unless-stopped
