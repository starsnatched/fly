# Full-stack deployment: C brain engine + the browser embodiment.
#
# The browser (vite dev server or any static host) talks to the brain ONLY
# through the API exposed here: WS :8787/stream (RGB frames in, action
# frames out) + REST :8788 (telemetry / actions / memory / health).
#
#   docker compose up --build
#   -> open http://localhost:5199  (client auto-detects ws://localhost:8787)
#
services:
  brain:
    build:
      context: ..
      dockerfile: cengine/Dockerfile
    container_name: flybrain-c
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      # connectome binary + config (read-only)
      - ../public:/data/public:ro
      - ../config:/data/config:ro
      # learned weights persist here between runs
      - ../state:/data/state
    restart: unless-stopped

  web:
    image: node:22-alpine
    container_name: flybrain-web
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5199"
    ports:
      - "5199:5199"
    volumes:
      - ..:/app
    depends_on:
      - brain
    restart: unless-stopped
